apiVersion: apps/v1
kind: Deployment
metadata:
  name: DEPLOYMENT_NAME
  namespace: NAMESPACE
  labels:
    app: PROJECT
spec:
  selector:
    matchLabels:
      project: PROJECT
  template:
    metadata:
      namespace: NAMESPACE
      labels:
        project: PROJECT
    spec:
      containers:
         - name: PROJECT
           image: REGISTRY_HOSTNAME/PROJECT:TAG_VERSION
           securityContext:
             allowPrivilegeEscalation: false
             runAsNonRoot: true
             runAsUser: 1001
           ports:
             - containerPort: PORT_CONTAINER
           readinessProbe:
             httpGet:
               path: /
               port: PORT_CONTAINER
             initialDelaySeconds: 30
             periodSeconds: 10
             failureThreshold: 5
           livenessProbe:
             httpGet:
               path: /
               port: PORT_CONTAINER
             initialDelaySeconds: 15
             periodSeconds: 20
             failureThreshold: 3
           resources:
             requests:
               memory: "512Mi"
               cpu: "100m"
             limits:
               memory: "1Gi"
               cpu: "500m"
